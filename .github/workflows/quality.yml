name: quality

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate evidence registry
        run: bun run validate:knowledge
      - name: Type check
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: HERMOS audit regression tests
        run: bun run test:audit-hermos
      - name: Training split readiness regression tests
        run: bun run test:training-splits
      - name: Image archive audit regression tests
        run: bun run test:image-dataset-audit
      - name: Classification split regression tests
        run: bun run test:classification-splits
      - name: Exploratory split regression tests
        run: bun run test:exploratory-splits
      - name: Python training script syntax checks
        run: python -m py_compile scripts/audit_image_classification_dataset.py scripts/prepare_classification_splits.py scripts/prepare_exploratory_splits.py scripts/train_image_classifier.py
      - name: Production build
        run: bun run build
