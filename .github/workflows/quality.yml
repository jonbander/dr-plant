name: quality

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate evidence registry
        run: bun run validate:knowledge
      - name: Type check
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: HERMOS audit regression tests
        run: bun run test:audit-hermos
      - name: Training split readiness regression tests
        run: bun run test:training-splits
      - name: Image archive audit regression tests
        run: bun run test:image-dataset-audit
      - name: Classification split regression tests
        run: bun run test:classification-splits
      - name: Exploratory split regression tests
        run: bun run test:exploratory-splits
      - name: Morphology V1 field identity and split leakage tests
        run: python -m unittest scripts.test_audit_grape_morphology_v1 -v
      - name: Training data gate regression tests
        run: bun run test:training-gate
      - name: Colab notebook training gate checks
        run: python scripts/research/test_notebook_training_gates.py
      - name: Python training entry-point guard checks
        run: python scripts/research/test_training_entrypoint_guards.py
      - name: Python training script syntax checks
        run: python -m py_compile scripts/audit_image_classification_dataset.py scripts/prepare_classification_splits.py scripts/prepare_exploratory_splits.py scripts/train_image_classifier.py scripts/research/validate-training-gate.py scripts/research/audit-phash.py scripts/research/test_validate_training_gate.py scripts/research/test_notebook_training_gates.py scripts/research/test_training_entrypoint_guards.py scripts/training_gate_guard.py scripts/train_citrus_field_v3.py scripts/train_lemon_v3_exploratory.py scripts/train_multicrop_full_v2.py scripts/research/cv_grape_finetune.py scripts/research/finetune_grape_existing_teacher.py scripts/research/train_grape_morphology_fusion.py scripts/research/train_ngld_self_supervised_distillation.py scripts/research/train_vitis_morphology.py results/multicrop-plantvillage-v1/train_image_classifier.py results/multicrop-plantvillage-v2/train_multicrop_full_v2.py results/plasmopara-v2-exploratory-2026-11-25/train_image_classifier.py scripts/research/audit_grape_morphology_v1.py scripts/test_audit_grape_morphology_v1.py
      - name: Production build
        run: bun run build
