<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Base background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Agricultural Crop Leaf -->
  <path d="M 256 90 C 370 90, 420 200, 410 320 C 360 410, 260 420, 256 420 C 252 420, 152 410, 102 320 C 92 200, 142 90, 256 90 Z" fill="url(#leafGrad)" />
  
  <!-- Leaf Central Vein -->
  <path d="M 256 120 C 256 220, 256 360, 256 410" stroke="#047857" stroke-width="12" stroke-linecap="round" />
  
  <!-- Lateral Veins -->
  <path d="M 256 180 C 290 160, 330 180, 360 190" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 256 220 C 220 200, 180 220, 150 230" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 256 260 C 295 245, 335 265, 365 280" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 256 305 C 215 295, 180 310, 155 330" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- AI Diagnostic Reticle / Scanner Corners -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M 120 170 L 120 130 L 160 130" />
    <path d="M 392 170 L 392 130 L 352 130" />
    <path d="M 120 342 L 120 382 L 160 382" />
    <path d="M 392 342 L 392 382 L 352 382" />
  </g>

  <!-- Glowing Sensor Ray Line -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="#fbbf24" stroke-width="6" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="4" />

  <!-- Offline Offline-Ready Badge (Tiny check or lightning) -->
  <g transform="translate(360, 360)">
    <circle cx="24" cy="24" r="32" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M 14 24 L 21 31 L 34 17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
